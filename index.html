<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    font-family: "Tajawal", "Tahoma", sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
    background: radial-gradient(ellipse at center, #2a0a1e 0%, #150410 60%, #000000 100%);
    color: white;
    min-height: 100vh;
    width: 100vw;
}

.background {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    top: 0;
    left: 0;
    z-index: 1;
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,77,109,0.25) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: pulse 6s ease-in-out infinite;
    pointer-events: none;
}

@keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15); }
}

.rose {
    position: absolute;
    width: 34px;
    animation: float linear infinite;
    opacity: 0.85;
    filter: drop-shadow(0 0 6px rgba(255,77,109,0.5));
    pointer-events: none;
}

.heart {
    position: absolute;
    color: #ff6b85;
    animation: float linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,77,109,0.7));
    pointer-events: none;
}

.sparkle {
    position: absolute;
    color: #ffd6de;
    animation: float linear infinite;
    text-shadow: 0 0 6px rgba(255,214,222,0.9);
    pointer-events: none;
}

@keyframes float {
    0% { transform: translateY(110vh) scale(0.4) rotate(0deg); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translateY(-15vh) scale(1.3) rotate(20deg); opacity: 0; }
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
}

@keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
}

.shooting-star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.8);
    animation: shoot 1.6s ease-in forwards;
    pointer-events: none;
}

.shooting-star::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    width: 90px;
    height: 1px;
    background: linear-gradient(to left, rgba(255,255,255,0.9), transparent);
    transform: translateY(0.5px);
}

@keyframes shoot {
    0% { transform: translate(0,0); opacity: 1; }
    100% { transform: translate(-260px, 260px); opacity: 0; }
}

.envelope-screen {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.8s ease, visibility 0.8s ease;
}

.envelope-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.envelope {
    position: relative;
    width: 220px;
    height: 150px;
    animation: envFloat 3s ease-in-out infinite;
    perspective: 400px;
}

@keyframes envFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.envelope-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ff4d6d, #d10035);
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(255,30,77,0.4);
}

.envelope-flap {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 110px solid transparent;
    border-right: 110px solid transparent;
    border-top: 85px solid #ff8fa3;
    transform-origin: top;
    z-index: 3;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
}

.wax-seal {
    position: absolute;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #b5384f, #6b1421 65%, #430c15);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.18), inset 0 -4px 7px rgba(0,0,0,0.45);
    animation: heartbeat 1.4s ease-in-out infinite;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.wax-seal::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px dashed rgba(212,175,140,0.55);
}

.wax-seal-print {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at 45% 45%, rgba(232,201,160,0.55) 0px, rgba(232,201,160,0.55) 1px, transparent 1.5px, transparent 3.2px);
    opacity: 0.85;
}

.wax-seal.breaking {
    opacity: 0;
    transform: translate(-50%, -50%) scale(1.3);
}

.seal-half {
    position: absolute;
    top: 55%;
    left: 50%;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #b5384f, #6b1421 65%, #430c15);
    box-shadow: 0 3px 12px rgba(0,0,0,0.5), inset 0 2px 5px rgba(255,255,255,0.18);
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
}

.seal-half.left {
    clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%);
}

.seal-half.right {
    clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
}

.seal-half.crack-left {
    animation: crackLeft 0.9s ease-in forwards;
}

.seal-half.crack-right {
    animation: crackRight 0.9s ease-in forwards;
}

@keyframes crackLeft {
    0% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }
    100% { opacity: 0; transform: translate(calc(-50% - 26px), calc(-50% + 40px)) rotate(-50deg); }
}

@keyframes crackRight {
    0% { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }
    100% { opacity: 0; transform: translate(calc(-50% + 26px), calc(-50% + 40px)) rotate(50deg); }
}

.wax-shard {
    position: fixed;
    width: 8px;
    height: 8px;
    background: linear-gradient(135deg, #b5384f, #6b1421);
    pointer-events: none;
    z-index: 20;
    animation: shardBurst 0.9s ease-out forwards;
}

@keyframes shardBurst {
    0% { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
}

@keyframes heartbeat {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
}

.envelope-hint {
    margin-top: 30px;
    font-size: 15px;
    line-height: 1.9;
    color: rgba(255,255,255,0.6);
    animation: fadeBlink 2s ease-in-out infinite;
}

@keyframes fadeBlink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
}

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

.card {
    max-width: 600px;
    padding: 50px 40px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    background-image: linear-gradient(rgba(15,3,9,0.75), rgba(15,3,9,0.75)), linear-gradient(120deg, #e8c9d0, #ff4d6d, #d4af8c, #f0e0c8, #ff4d6d, #e8c9d0, #d4af8c);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    background-size: 100% 100%, 300% 300%;
    background-position: 0 0, 0% 50%;
    border-radius: 28px;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    opacity: 0;
    transform: scale(0.9);
    transition: opacity 1s ease, transform 1s ease;
}

.card.show {
    opacity: 1;
    transform: scale(1);
    animation: shimmerBorder 7s linear infinite 1s;
}

@keyframes shimmerBorder {
    0% { background-position: 0 0, 0% 50%; }
    100% { background-position: 0 0, 300% 50%; }
}

.title {
    font-family: "Amiri", serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: linear-gradient(135deg, #e8c9d0, #ff4d6d, #d4af8c, #ff8fa3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    opacity: 0;
    text-shadow: 0 0 30px rgba(255,143,163,0.3);
}

.divider {
    width: 70px;
    height: 2px;
    margin: 0 auto 30px;
    background: linear-gradient(to right, transparent, #d4af8c, #ff4d6d, #d4af8c, transparent);
    opacity: 0;
}

.card.show .divider {
    animation: fadeIn 1.5s ease forwards 0.5s;
}

.card.show .title {
    animation: fadeIn 1.5s ease forwards 0.2s;
}

.quote-mark {
    font-family: "Amiri", serif;
    font-size: 50px;
    color: rgba(255,77,109,0.35);
    line-height: 0.5;
    margin-bottom: 10px;
    opacity: 0;
}

.card.show .quote-mark {
    animation: fadeIn 1.5s ease forwards 0.4s;
}

.message {
    font-family: "Amiri", serif;
    font-size: 25px;
    font-weight: 400;
    line-height: 2.5;
    letter-spacing: 0.2px;
    color: #ffffff;
    min-height: 300px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}

.message .line {
    opacity: 0;
    display: block;
}

.message span {
    color: #ffd6de;
    font-weight: 700;
    text-shadow: 0 0 16px rgba(255,77,109,0.7), 0 2px 6px rgba(0,0,0,0.6);
}

.cursor-blink {
    display: inline-block;
    width: 2px;
    background: #ff8fa3;
    margin-inline-start: 2px;
    animation: blink 0.8s steps(1) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

button {
    position: relative;
    margin-top: 40px;
    padding: 16px 36px;
    font-size: 17px;
    font-family: "Tajawal", sans-serif;
    border: 1px solid rgba(212,175,140,0.4);
    border-radius: 40px;
    background: linear-gradient(135deg, #ff4d6d, #ff1e4d);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,30,77,0.5);
    transition: 0.3s;
    opacity: 0;
    overflow: visible;
}

.card.show button.visible {
    animation: fadeIn 1.2s ease forwards, glowPulse 2.5s ease-in-out infinite 1.5s;
}

button:hover {
    background: linear-gradient(135deg, #ff1e4d, #d10035);
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(255,30,77,0.7);
}

button:active {
    transform: scale(0.95);
}

@keyframes glowPulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(255,30,77,0.5); }
    50% { box-shadow: 0 4px 30px rgba(255,30,77,0.9); }
}

.hint {
    display: block;
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    opacity: 0;
}

.card.show .hint.visible {
    animation: fadeIn 1.2s ease forwards;
}

.brand-signature {
    margin-top: 34px;
    font-size: 12px;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #d4af8c, #f0e0c8, #d4af8c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    text-transform: uppercase;
}

.card.show .brand-signature.visible {
    animation: fadeIn 1.5s ease forwards 0.4s;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
    .title { font-size: 26px; }
    .message { font-size: 20px; line-height: 2.3; min-height: 260px; }
    .card { padding: 40px 24px; }
}

.tap-particle {
    position: fixed;
    pointer-events: none;
    z-index: 25;
    animation: tapFloat 1s ease-out forwards;
}

@keyframes tapFloat {
    0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.1); opacity: 0; }
}

.open-burst {
    position: fixed;
    pointer-events: none;
    z-index: 20;
    animation: openBurst 1.6s ease-out forwards;
}

@keyframes openBurst {
    0% { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
}

.burst-heart {
    position: fixed;
    width: 20px;
    height: 20px;
    color: #ff4d6d;
    pointer-events: none;
    z-index: 20;
    animation: burst 1.2s ease-out forwards;
}

@keyframes burst {
    0% { transform: translate(0,0) scale(0.6); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
}

#musicToggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100;
    font-size: 22px;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(212,175,140,0.4);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    user-select: none;
}

#musicToggle.visible {
    opacity: 1;
    visibility: visible;
}

#musicToggle:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.1);
    transition: 0.3s;
}
</style>
</head>

<body>

<div id="musicToggle" onclick="toggleMusic()">🔊</div>

<!-- رابط البيانو الرومانسي الجديد -->
<audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
</audio>

<div class="background" id="bg">
    <div class="glow"></div>
</div>

<div class="envelope-screen" id="envelopeScreen" onclick="openEnvelope()">
    <div class="envelope">
        <div class="envelope-body"></div>
        <div class="envelope-flap"></div>
        <div class="wax-seal" id="waxSeal"><div class="wax-seal-print"></div></div>
        <div class="seal-half left" id="sealHalfLeft"><div class="wax-seal-print"></div></div>
        <div class="seal-half right" id="sealHalfRight"><div class="wax-seal-print"></div></div>
    </div>
    <div class="envelope-hint">اضغطي عشان تفتحي الرسالة</div>
    <div style="margin-top: 10px; font-size: 13px; color: rgba(255,255,255,0.45);">🎵 جهزي سماعاتك.. فيه موسيقى هادية جوة</div>
</div>

<div class="container">
    <div class="card" id="card">
        <div class="title">إليكِ ❤️</div>
        <div class="divider"></div>
        <div class="quote-mark">"</div>
        <div class="message" id="message"></div>

        <button onclick="goToSong(event)">إسمعي دي 🎶</button>
        <span class="hint">لحن صغير يقول اللي مش قادر أقوله كله بالكلام</span>
        <div class="brand-signature">أَثَر — Athar</div>
    </div>
</div>

<script>
const bg = document.getElementById("bg");

const roses = [
    "https://cdn-icons-png.flaticon.com/512/616/616490.png",
    "https://cdn-icons-png.flaticon.com/512/2909/2909762.png"
];
const sparkles = ["✨", "💫", "⭐", "💎"];

// قلب مرسوم بالكود (SVG) بدل الإيموجي - شكل أنعم ومتناسق مع ألوان البراند
function heartSVG() {
    return '<svg viewBox="0 0 32 29" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;"><path fill="currentColor" d="M23.6,0c-3,0-5.7,1.6-7.6,4.1C14.1,1.6,11.4,0,8.4,0C3.8,0,0,3.8,0,8.6c0,8.1,10.5,14.6,15.3,18.9c0.4,0.3,0.9,0.3,1.3,0C21.5,23.2,32,16.7,32,8.6C32,3.8,28.2,0,23.6,0z"/></svg>';
}

function createElement(type) {
    let el;
    if (type === "rose") {
        el = document.createElement("img");
        el.src = roses[Math.floor(Math.random() * roses.length)];
        el.className = "rose";
    } else if (type === "sparkle") {
        el = document.createElement("div");
        el.className = "sparkle";
        el.innerHTML = sparkles[Math.floor(Math.random() * sparkles.length)];
        el.style.fontSize = (12 + Math.random() * 10) + "px";
    } else {
        el = document.createElement("div");
        el.className = "heart";
        el.innerHTML = heartSVG();
        const size = 12 + Math.random() * 9;
        el.style.width = size + "px";
        el.style.height = size + "px";
    }

    el.style.left = Math.random() * 100 + "vw";
    const duration = 7 + Math.random() * 6;
    el.style.animationDuration = duration + "s";

    bg.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
}

function createStars(count) {
    for (let i = 0; i < count; i++) {
        const star = document.createElement("div");
        star.className = "star";
        const size = 1 + Math.random() * 2;
        star.style.width = size + "px";
        star.style.height = size + "px";
        star.style.left = Math.random() * 100 + "vw";
        star.style.top = Math.random() * 100 + "vh";
        star.style.animationDuration = (2 + Math.random() * 3) + "s";
        bg.appendChild(star);
    }
}
createStars(70);

function createShootingStar() {
    const s = document.createElement("div");
    s.className = "shooting-star";
    s.style.top = Math.random() * 40 + "vh";
    s.style.left = 60 + Math.random() * 35 + "vw";
    bg.appendChild(s);
    setTimeout(() => s.remove(), 1700);
}

setInterval(() => createElement("rose"), 1000);
setInterval(() => createElement("heart"), 750);
setInterval(() => createElement("sparkle"), 500);
setInterval(createShootingStar, 3500);

let audioCtx;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playChime() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const start = now + i * 0.12;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.15, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 1.1);
        osc.start(start);
        osc.stop(start + 1.2);
    });
}

function playPop() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
}

let isMusicMuted = false;
let envelopeOpened = false;
const bgMusic = document.getElementById("bgMusic");
if (bgMusic) bgMusic.volume = 0.5;

function toggleMusic() {
    const toggleBtn = document.getElementById("musicToggle");
    if (isMusicMuted) {
        bgMusic.play();
        toggleBtn.innerHTML = "🔊";
        isMusicMuted = false;
    } else {
        bgMusic.pause();
        toggleBtn.innerHTML = "🔇";
        isMusicMuted = true;
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        bgMusic.pause();
    } else {
        if (envelopeOpened && !isMusicMuted) {
            bgMusic.play();
        }
    }
});

function openEnvelope() {
    playChime();
    breakWaxSeal();

    envelopeOpened = true;
    if (bgMusic) bgMusic.play().catch(e => console.log("Audio play blocked:", e));
    document.getElementById("musicToggle").classList.add("visible");

    const screen = document.getElementById("envelopeScreen");
    const flap = document.querySelector(".envelope-flap");

    // 1) الختم بيتكسر الأول (breakWaxSeal فوق)
    // 2) بعدين الغطاء يتفتح لما الختم يخلص
    setTimeout(() => {
        flap.style.transition = "transform 0.6s ease";
        flap.style.transform = "rotateX(180deg)";
    }, 450);

    // 3) القلوب والورد يطلعوا من جوه الظرف بعد ما الغطاء يتفتح شوية
    setTimeout(() => {
        triggerOpenBurst();
    }, 850);

    // 4) الظرف يختفي وتظهر الرسالة
    setTimeout(() => {
        screen.classList.add("hidden");
        document.getElementById("card").classList.add("show");

}

function breakWaxSeal() {
    const seal = document.getElementById("waxSeal");
    const halfLeft = document.getElementById("sealHalfLeft");
    const halfRight = document.getElementById("sealHalfRight");
    if (!seal) return;
    const rect = seal.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    seal.classList.add("breaking");

    if (halfLeft && halfRight) {
        halfLeft.style.opacity = "1";
        halfRight.style.opacity = "1";
        halfLeft.classList.add("crack-left");
        halfRight.classList.add("crack-right");
        setTimeout(() => {
            halfLeft.style.opacity = "0";
            halfRight.style.opacity = "0";
        }, 950);
    }

    for (let i = 0; i < 6; i++) {
        const shard = document.createElement("div");
        shard.className = "wax-shard";
        shard.style.left = cx + "px";
        shard.style.top = cy + "px";

        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 45;
        shard.style.setProperty("--dx", Math.cos(angle) * dist + "px");
        shard.style.setProperty("--dy", Math.sin(angle) * dist + "px");
        shard.style.setProperty("--rot", (Math.random() * 360 - 180) + "deg");

        document.body.appendChild(shard);
        setTimeout(() => shard.remove(), 1000);
    }
}

const urlParams = new URLSearchParams(window.location.search);

let clientName = urlParams.get("name");
let songLink = urlParams.get("song") || "PUT_YOUR_SONG_LINK_HERE";
let msgParam = urlParams.get("msg");

const dParam = urlParams.get("d");
if (dParam) {
    try {
        const decompressed = LZString.decompressFromEncodedURIComponent(dParam);
        const data = JSON.parse(decompressed);
        clientName = data.n || clientName;
        songLink = data.s || songLink;
        msgParam = Array.isArray(data.m) ? data.m.join("|") : msgParam;
    } catch (e) {
    }
}

if (clientName) {
    document.querySelector(".title").innerHTML = clientName + " ❤️";
}

const lines = msgParam
    ? msgParam.split("|")
    : [
        "لم أكن أؤمن أن للحظات أثرًا",
        "حتى أصبحتِ أنتِ ‹اللحظة› التي تغيّر كل شيء بداخلي.",
        "",
        "معكِ فقط،",
        "أشعر أن العالم أخف،",
        "وأن ‹قلبي› وجد مكانه أخيرًا ❤️"
    ];

function showControls() {
    document.querySelector("button").classList.add("visible");
    document.querySelector(".hint").classList.add("visible");
    document.querySelector(".brand-signature").classList.add("visible");
}

function startTypewriter() {
    const container = document.getElementById("message");
    container.innerHTML = "";
    let lineIndex = 0;

    function typeLine() {
        if (lineIndex >= lines.length) {
            showControls();
            return;
        }

        const lineText = lines[lineIndex];
        const lineEl = document.createElement("span");
        lineEl.className = "line";
        lineEl.style.opacity = "1";
        container.appendChild(lineEl);

        if (lineText === "") {
            lineEl.innerHTML = "<br>";
            lineIndex++;
            setTimeout(typeLine, 250);
            return;
        }

        const chars = [];
        let highlighted = false;
        for (const ch of lineText) {
            if (ch === "‹") { highlighted = true; continue; }
            if (ch === "›") { highlighted = false; continue; }
            chars.push({ ch, highlighted });
        }

        const cursor = document.createElement("span");
        cursor.className = "cursor-blink";
        cursor.innerHTML = "&nbsp;";

        let charIndex = 0;
        const interval = setInterval(() => {
            charIndex++;

            let html = "";
            let i = 0;
            while (i < charIndex) {
                const isHi = chars[i].highlighted;
                let segment = "";
                while (i < charIndex && chars[i] && chars[i].highlighted === isHi) {
                    segment += chars[i].ch;
                    i++;
                }
                html += isHi ? `<span>${segment}</span>` : segment;
            }
            lineEl.innerHTML = html;
            lineEl.appendChild(cursor);

            if (charIndex >= chars.length) {
                clearInterval(interval);
                cursor.remove();
                lineIndex++;
                setTimeout(typeLine, 180);
            }
        }, 28);
    }
    typeLine();
}
